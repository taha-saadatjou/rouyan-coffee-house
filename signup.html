<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign up | Rouyan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/site.css">
</head>

<body>
    <div class="grain"></div>
    <script src="assets/components.js"></script>
    <script>shell()</script>
    <main class="grid min-h-[calc(100vh-73px)] lg:grid-cols-2">
        <section class="order-2 flex items-center justify-center bg-[#f8f3ea] p-5 lg:order-1">
            <div class="w-full max-w-md rounded-[2rem] bg-[#fffdf8] p-7 shadow-xl sm:p-10">
                <p class="text-xs font-bold uppercase tracking-[.2em] text-[#c97846]">Join the house</p>
                <h1 class="display mt-2 text-4xl">Make it yours</h1>
                <form id="signupForm" class="mt-7" novalidate>
                    <div class="form-content"><label class="block text-sm font-bold">Full name<input class="field mt-2"
                                name="name" required autocomplete="name"></label><label
                            class="mt-4 block text-sm font-bold">Email address<input class="field mt-2" name="email"
                                type="email" required autocomplete="email"></label><label
                            class="mt-4 block text-sm font-bold">Password<input class="field mt-2" name="password"
                                type="password" minlength="6" required autocomplete="new-password"></label><label
                            class="mt-4 block text-sm font-bold">Confirm password<input class="field mt-2"
                                name="confirmPassword" type="password" required autocomplete="new-password"></label>
                        <p class="mt-3 text-xs text-stone-500">Use 6 or more characters.</p><button
                            class="btn mt-6 w-full bg-[#211913] text-white">Create account <span>→</span></button>
                    </div>
                    <div class="form-success hidden py-8 text-center">
                        <div class="mx-auto grid h-14 w-14 place-items-center rounded-full bg-[#dcebdd] text-2xl">✓
                        </div>
                        <p class="display mt-4 text-2xl">You’re part of Rouyan.</p>
                    </div>
                </form>
                <p class="mt-6 text-center text-sm text-stone-600">Already have an account? <a
                        class="font-bold text-[#c97846]" href="login.html">Log in</a></p>
            </div>
        </section>
        <section class="relative hidden overflow-hidden bg-[#78947e] p-12 text-white lg:block">
            <div class="absolute -right-32 top-24 h-96 w-96 rounded-full bg-[#c97846] opacity-60 blur-3xl"></div>
            <div class="relative">
                <p class="text-sm uppercase tracking-[.2em] text-[#e6eedf]">Coffee, your way</p>
                <h2 class="display mt-5 max-w-md text-6xl">A little more good in every morning.</h2>
                <div class="mt-20 rounded-3xl bg-white/15 p-6 backdrop-blur">
                    <p class="text-lg">“The kind of place that turns a quick coffee into a lovely pause.”</p>
                    <p class="mt-4 text-sm text-[#e6eedf]">— A neighbour, probably</p>
                </div>
            </div>
        </section>
    </main>
    <script>end()</script>
    <script src="assets/site.js"></script>
    <script>initForm(document.querySelector('#signupForm'))</script>
</body>

</html>
